name: Data correction
description: Report a correction with a permanent ID and source evidence.
title: "[Data correction] "
body:
  - type: dropdown
    id: subject_type
    attributes:
      label: Subject type
      options: [Name, Sense, Passage, Attestation, Note, SourceText, Identification]
    validations:
      required: true
  - type: input
    id: subject_id
    attributes:
      label: Permanent subject ID or CTS URN
    validations:
      required: true
  - type: input
    id: dataset_version
    attributes:
      label: Dataset version
  - type: textarea
    id: current_value
    attributes:
      label: Current reading or classification
    validations:
      required: true
  - type: textarea
    id: proposed_correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source evidence and explanation
      description: Include a reference, quotation, or source link that supports the correction.
    validations:
      required: true
